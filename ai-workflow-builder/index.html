<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workflow Builder | Intemo</title>
  <meta name="description" content="Configure, validate, and simulate freight workflows with Intemo's AI Workflow Builder.">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <style>
    #app-loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #6b7280;
      font: 500 13px/1.5 Inter, system-ui, sans-serif;
      background: #f0f2f5;
    }
  </style>
</head>
<body>
  <div id="root"><div id="app-loading">Loading AI Workflow Builder...</div></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    fetch("app.jsx")
      .then(function (response) { return response.text(); })
      .then(function (source) {
        var compiled = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]]
        }).code;
        var script = document.createElement("script");
        script.textContent = compiled;
        document.body.appendChild(script);
      })
      .catch(function () {
        document.getElementById("app-loading").textContent = "Unable to load the workflow builder.";
      });
  </script>
</body>
</html>
